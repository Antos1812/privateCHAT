<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>WIADO</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1e1f26;
    color: #eee;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* --- Join screen --- */
  #join-screen {
    text-align: center;
  }
  #join-screen h1 {
    margin-bottom: 8px;
  }
  #join-screen p {
    color: #999;
    margin-top: 0;
  }
  #name-input {
    padding: 10px 14px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #2a2b33;
    color: #eee;
    margin-right: 8px;
  }
  #join-btn {
    padding: 10px 18px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    background: #5865f2;
    color: white;
    cursor: pointer;
  }
  #join-btn:hover { background: #4752c4; }

  /* --- Chat screen --- */
  #chat-screen {
    display: none;
    width: 100%;
    max-width: 700px;
    height: 90vh;
    background: #262730;
    border-radius: 12px;
    overflow: hidden;
    flex-direction: column;
  }
  #chat-header {
    padding: 14px 18px;
    background: #2f303a;
    border-bottom: 1px solid #3a3b45;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #chat-header h2 { margin: 0; font-size: 16px; }
  #online-list { font-size: 12px; color: #999; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  .msg {
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .msg .who {
    font-weight: 600;
    color: #8ab4f8;
    margin-right: 6px;
  }
  .msg.me .who { color: #7ee787; }
  .msg img {
    display: block;
    max-width: 260px;
    max-height: 260px;
    border-radius: 8px;
    margin-top: 6px;
    cursor: pointer;
  }
  .system {
    text-align: center;
    color: #777;
    font-size: 12px;
    margin: 10px 0;
  }
  #typing-indicator {
    font-size: 12px;
    color: #888;
    height: 18px;
    padding: 0 16px;
  }

  #input-bar {
    display: flex;
    padding: 12px;
    border-top: 1px solid #3a3b45;
    gap: 8px;
  }
  #msg-input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #2a2b33;
    color: #eee;
    font-size: 15px;
  }
  #send-btn {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: #5865f2;
    color: white;
    cursor: pointer;
  }
  #send-btn:hover { background: #4752c4; }
  #image-btn {
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #2a2b33;
    color: #eee;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
  }
  #image-btn:hover { background: #333542; }
  #image-input { display: none; }
  #image-preview-bar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    background: #2a2b33;
    border-top: 1px solid #3a3b45;
  }
  #image-preview-bar img {
    max-height: 50px;
    border-radius: 6px;
  }
  #image-preview-bar button {
    background: none;
    border: 1px solid #555;
    color: #ccc;
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }

  /* --- Phone-sized screens --- */
  @media (max-width: 600px) {
    body {
      align-items: stretch;
      justify-content: stretch;
    }
    #chat-screen {
      max-width: none;
      width: 100%;
      height: 100vh;
      height: 100dvh; /* accounts for mobile browser address bar */
      border-radius: 0;
    }
    #chat-header {
      padding: 16px;
    }
    #chat-header h2 { font-size: 18px; }
    #online-list { font-size: 11px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    #messages { padding: 12px; }
    .msg { font-size: 16px; margin-bottom: 14px; }
    .msg img { max-width: 70vw; max-height: 300px; }

    #input-bar {
      padding: 10px;
      gap: 6px;
      /* keep the bar clear of the iPhone home-swipe area */
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }
    #msg-input {
      font-size: 16px; /* 16px+ stops iOS from auto-zooming in on focus */
      padding: 12px 14px;
    }
    #send-btn {
      padding: 12px 16px;
      font-size: 15px;
    }
    #image-btn {
      padding: 12px 14px;
      font-size: 20px;
    }
    #join-screen {
      padding: 0 20px;
    }
    #name-input {
      font-size: 16px;
      padding: 12px 14px;
      width: 100%;
      margin: 0 0 12px 0;
      display: block;
    }
    #join-btn {
      width: 100%;
      padding: 12px;
      font-size: 16px;
    }
  }
</style>
</head>
<body>

  <!-- Screen 1: pick a username -->
  <div id="join-screen">
    <h1>💬 WIADO</h1>
    <p>Wybierz nazwę</p>
    <input id="name-input" placeholder="Nazwa" maxlength="20" />
    <button id="join-btn">Wbijaj</button>
  </div>

  <!-- Screen 2: the actual chat -->
  <div id="chat-screen">
    <div id="chat-header">
      <h2>💬 WIADO</h2>
      <div id="online-list"></div>
    </div>
    <div id="messages"></div>
    <div id="typing-indicator"></div>
    <div id="image-preview-bar">
      <img id="image-preview" src="" alt="preview" />
      <span style="font-size:12px;color:#999;">Gotowe do wysłania</span>
      <button id="cancel-image-btn">Usuń</button>
    </div>
    <div id="input-bar">
      <button id="image-btn" title="Send an image">📷</button>
      <input type="file" id="image-input" accept="image/*" />
      <input id="msg-input" placeholder="Type a message..." autocomplete="off" />
      <button id="send-btn">Wyślij</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const joinScreen = document.getElementById("join-screen");
    const chatScreen = document.getElementById("chat-screen");
    const nameInput = document.getElementById("name-input");
    const joinBtn = document.getElementById("join-btn");
    const messages = document.getElementById("messages");
    const msgInput = document.getElementById("msg-input");
    const sendBtn = document.getElementById("send-btn");
    const onlineList = document.getElementById("online-list");
    const typingIndicator = document.getElementById("typing-indicator");
    const imageBtn = document.getElementById("image-btn");
    const imageInput = document.getElementById("image-input");
    const imagePreviewBar = document.getElementById("image-preview-bar");
    const imagePreview = document.getElementById("image-preview");
    const cancelImageBtn = document.getElementById("cancel-image-btn");

    let myName = "";
    let pendingImageData = null; // holds a compressed base64 image ready to send

    const MAX_IMAGE_DIMENSION = 1000; // pixels, longest side
    const JPEG_QUALITY = 0.7;

    // Shrink and compress the image in the browser before sending, so a
    // 12MB phone photo doesn't clog the chat for everyone else.
    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > height && width > MAX_IMAGE_DIMENSION) {
              height = Math.round((height * MAX_IMAGE_DIMENSION) / width);
              width = MAX_IMAGE_DIMENSION;
            } else if (height > MAX_IMAGE_DIMENSION) {
              width = Math.round((width * MAX_IMAGE_DIMENSION) / height);
              height = MAX_IMAGE_DIMENSION;
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            canvas.getContext("2d").drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", JPEG_QUALITY));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    imageBtn.addEventListener("click", () => imageInput.click());

    imageInput.addEventListener("change", async () => {
      const file = imageInput.files[0];
      if (!file) return;
      if (!file.type.startsWith("image/")) {
        alert("Please choose an image file.");
        return;
      }
      try {
        pendingImageData = await compressImage(file);
        imagePreview.src = pendingImageData;
        imagePreviewBar.style.display = "flex";
      } catch (err) {
        alert("Couldn't load that image, try a different one.");
      }
    });

    cancelImageBtn.addEventListener("click", () => {
      pendingImageData = null;
      imageInput.value = "";
      imagePreviewBar.style.display = "none";
    });

    function join() {
      const name = nameInput.value.trim();
      if (!name) return;
      myName = name;
      socket.emit("join", name);
      joinScreen.style.display = "none";
      chatScreen.style.display = "flex";
      msgInput.focus();
    }

    joinBtn.addEventListener("click", join);
    nameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") join();
    });

    function addMessage(username, text) {
      const div = document.createElement("div");
      div.className = "msg" + (username === myName ? " me" : "");
      div.innerHTML = `<span class="who">${escapeHtml(username)}:</span>${escapeHtml(text)}`;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function addImageMessage(username, imageData) {
      const div = document.createElement("div");
      div.className = "msg" + (username === myName ? " me" : "");
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = username + ":";
      const img = document.createElement("img");
      img.src = imageData;
      img.addEventListener("click", () => window.open(imageData, "_blank"));
      div.appendChild(who);
      div.appendChild(img);
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function addSystemMessage(text) {
      const div = document.createElement("div");
      div.className = "system";
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    function sendMessage() {
      // If an image is staged, send that first (its own message)
      if (pendingImageData) {
        socket.emit("chat image", pendingImageData);
        pendingImageData = null;
        imageInput.value = "";
        imagePreviewBar.style.display = "none";
      }
      const text = msgInput.value.trim();
      if (text) {
        socket.emit("chat message", text);
        msgInput.value = "";
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
      else socket.emit("typing");
    });

    socket.on("chat message", (data) => {
      addMessage(data.username, data.text);
    });

    socket.on("chat image", (data) => {
      addImageMessage(data.username, data.imageData);
    });

    socket.on("system message", (text) => {
      addSystemMessage(text);
    });

    socket.on("user list", (users) => {
      onlineList.textContent = "Online: " + users.join(", ");
    });

    let typingTimeout;
    socket.on("typing", (username) => {
      typingIndicator.textContent = `${username} is typing...`;
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => (typingIndicator.textContent = ""), 1500);
    });
  </script>
</body>
</html>
